[project]
name = "auto-labeling-pipeline"
version = "1.8.5"
description = "Auto labeling pipeline for doccano"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [ {name = "Hironsan", email = "hiroki.nakayama.py@gmail.com"},{ name="newtondotcom"}]
dependencies = [
    "requests==2.34.2",
    "boto3==1.43.89",
    "jinja2==3.1.6",
    "pydantic>=2.3.0",
]

[dependency-groups]
dev = [
    "vcrpy>=8.3.0",
]

[project.urls]
Homepage = "https://github.com/doccano/auto-labeling-pipeline"
Repository = "https://github.com/doccano/auto-labeling-pipeline"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
